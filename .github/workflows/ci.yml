name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 只跑不依赖网络的检查：语法、图标素材是否和图标表对得上。
# 完整的功能自检（tools/smoke.js，会真的打开窗口加载各家站点）留在本地跑，见 README。
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: |
          npm ci
          npm --prefix src-ui ci

      - name: 语法检查（Electron 入口，保留作回退路径）
        run: npm run lint

      # Tauri 版的前端：IPC 命令名契约 + 类型检查 + 打包。
      # 命令名拼错时类型系统看不出来，要等用户点到那个按钮才炸。
      - name: 检查（Tauri 前端）
        run: npm run lint:ui

      # 白屏在 CI 里看不出来：构建能过、进程能起，只是 #app 里空的。
      # 这里把前端模块图加载一遍，专门盯「模块顶层求值就抛错」这类问题。
      - name: 前端模块加载检查
        run: npm run test:ui-module

      - name: 校验图标素材（图标表 / 深浅变体 / 打包白名单）
        run: npm run check:icons
