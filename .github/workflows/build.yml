name: Build

# 自动打包（Electron 回退路径）：Windows x64（NSIS 安装包）+ macOS arm64（dmg / zip，Apple Silicon）。
# 只在手动触发（workflow_dispatch）时跑，出 Artifacts，不碰 Release。
# 这套留作回退：日常发版由 build-tauri.yml 负责；两个工作流都监听标签的话，
# 谁先跑完谁的产物先上 Release，v0.3.0 就是这么被传上去一个 113 MB 的 Electron 包
# （本该是 2 MB 的 Tauri 包）。已经确定走 Tauri 了，没必要每次推 main 再证明一遍它能打。
on:
  workflow_dispatch:

# 只上传 Artifacts，不建 Release，读权限就够
permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 图标素材是产物不是源，先按图标表重新生成一遍，保证打进包里的是最新的。
      # （生成脚本 tools/build-icons.js 是纯 Node；需要 Electron 的 menu-icons 由 CI 的 checks 任务校验）
      - name: 生成图标素材
        run: npm run icons

      - name: 打包（NSIS 一键安装）
        run: npx electron-builder --win --x64 --publish never

      - name: 显示产物大小
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe |
            Select-Object Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      # latest.yml 是 electron-updater 的更新源，blockmap 是差量下载用的；
      # 少传一个都会让自动更新退化成每次全量下载，或者干脆找不到新版本。
      - uses: actions/upload-artifact@v6
        with:
          name: aihub-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15 # Apple Silicon（M 系列）runner
    env:
      # 没配签名证书时不要去找钥匙串，否则打包会在签名那步失败。
      # 以后要做签名 + 公证：把这个删掉，改用 CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID 等 secret。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成图标素材
        run: npm run icons

      # mac 的 .icns 由 electron-builder 从 build/icon.png（1024）现场转出来
      - name: 打包（dmg + zip，Apple Silicon）
        run: npx electron-builder --mac --arm64 --publish never

      - name: 显示产物大小
        run: ls -lh dist/*.dmg dist/*.zip

      - uses: actions/upload-artifact@v6
        with:
          name: aihub-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # 这里原来有个 release job（推 v* 标签时建 Release），已经删掉：
  # 发版统一由 build-tauri.yml 负责，两套都建 Release 会互相覆盖产物。
  # 这个工作流只出 Artifacts，作为 Electron 版的回退构建路径。
