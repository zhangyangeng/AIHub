name: Build (Tauri)

# Tauri 版打包：Windows x64（NSIS）+ macOS arm64（dmg）。
# 只在推 v* 标签时打包并发 Release（含 latest.json，tauri-plugin-updater 的更新源）；
# main / PR 上只跑 test 门禁，不出包——打包是 cargo release 全量编译，两个平台十几分钟，
# 每次都跑只会让每次推送都卡在等 CI 上。打包能不能过，交给打标签那一次验证。
# 要用 main 上的代码出个包，手动触发（workflow_dispatch）。
on:
  push:
    branches: [main, master]
    tags: ['v*']
    # 纯文档改动不跑。路径过滤对 tag 推送不生效（GitHub 的既定行为），
    # 所以这不会影响发版。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

# 同一分支又推了一次时，取消上一轮还在排队的构建。
# 标签构建例外：发版中途被取消会留下半个 Release。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write

jobs:
  # Rust 侧的快速门禁：布局几何 / 配置迁移 / 视图回收都有单测。
  # main / PR 上真正跑的只有这个 job；它挂了就别打标签了。
  test:
    name: Rust 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 构建脚本要读 frontendDist（../src-ui/dist），干净检出上这个目录不存在，
      # 不先构建前端的话 cargo 阶段就会报错。
      - name: 构建前端
        run: |
          npm --prefix src-ui ci
          npm --prefix src-ui run build
      # Linux 上 tauri 要链 webkit2gtk 才能编译（测试本身不开窗口）
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-features

  # 打包作业：只有打标签发版、或手动触发才跑。
  build:
    name: ${{ matrix.label }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aihub-windows-x64
          - label: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            artifact: aihub-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 标签和包里的版本必须一致：latest.json 的版本取自标签名（见下面 release 作业），
      # 而 exe 里编译进去的版本取自 tauri.conf.json。两边不一致时客户端要么收不到更新，
      # 要么装完还是旧版本、然后反复提示更新——不报错的坑，所以在这里硬拦一道。
      - name: 版本与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签是 $GITHUB_REF_NAME，但 tauri.conf.json 里是 $v；先用 npm run release 升版本再打标签"
            exit 1
          fi
          echo "版本 $v 与标签一致"

      - name: 安装依赖
        run: |
          npm ci
          npm --prefix src-ui ci

      # 图标素材是产物不是源，按图标表重新生成一遍。
      # 前端的打包由 tauri build 的 beforeBuildCommand 负责调用。
      - name: 生成图标素材
        run: npm run icons

      - name: 打包
        env:
          # 更新包的签名密钥。没配 secret 时 Tauri 会跳过签名，
          # 产物照样能装，只是自动更新不可用（updater 会拒绝未签名的包）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: 显示产物大小
        shell: bash
        run: |
          find src-tauri/target/${{ matrix.target }}/release/bundle \
            -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.sig' \) \
            -exec ls -lh {} \;

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 更新日志要按「上一个标签..当前」取提交，只拉一个提交算不出来
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 汇总产物并生成 latest.json
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \
            -o -name '*.tar.gz' -o -name '*.sig' \) -exec cp {} release/ \;
          ls -lh release
          # tauri-plugin-updater 的更新源。它按 platform 键找包，
          # 每个包都要带上对应 .sig 的内容，否则客户端会拒绝安装。
          node .github/scripts/make-latest-json.mjs \
            "${GITHUB_REF_NAME#v}" release "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"
          cat release/latest.json

      # GitHub 的 --generate-notes 只统计合并进来的 PR，本仓库一直直接推 main，
      # 它生成出来只有一行 Full Changelog 链接。这里按提交信息自己分组。
      # 本地预览某个区间：node .github/scripts/make-release-notes.mjs - <base>
      - name: 生成发版说明
        run: node .github/scripts/make-release-notes.mjs /tmp/notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Aihub $tag" \
              --notes-file /tmp/notes.md
          fi
