[package]
name = "aihub"
version = "0.3.3"
description = "把常用的 AI 聊天网站聚合到一个窗口里"
authors = ["Aihub contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aihub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# multiwebview（一个窗口里挂多个 webview）到今天仍锁在 unstable 后面，
# 这个 app 的分屏就是靠它，所以必须开。副作用：Tauri 小版本升级可能破 API。
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
# 账号迁移（src/login.rs）：导出文件可选加密。
# 方案照搬 Electron 版：scrypt(N=16384,r=8,p=1) 派生 32 字节密钥 + AES-256-GCM。
# 参数必须和 Node 的 crypto.scryptSync 默认值一致，否则老版本导出的文件解不开。
aes-gcm = "0.10"
scrypt = "0.11"
base64 = "0.22"
# 和 tauri 用的是同一个 cookie crate（tauri_runtime 再导出的就是它），
# 版本必须落在同一个 semver 区间，否则 set_cookie 的类型对不上。
cookie = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# 只在 mac 上用来摘掉窗口的 FullSizeContentView（见 src/macos.rs）。
# 这两个 crate 本来就在 tauri 的依赖树里（wry 直接用），引进来不增加什么体积；
# 特性清单跟着 wry 走，别用默认特性（默认会把 AppKit 全套拖进来）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSWindow",
  "NSView",
  "NSResponder",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"   # 体积优先：这个 app 的瓶颈从来不是 CPU
panic = "abort"
strip = true
